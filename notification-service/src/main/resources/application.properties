spring.application.name=notification-service
server.port=8083
server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
app.jwt-secret=${MUSIC_JWT_SECRET}
app.internal-secret=${MUSIC_INTERNAL_SECRET}
app.user-url=http://localhost:8081
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=jdbc:h2:file:./data/notification-service
spring.datasource.username=sa
spring.datasource.password=${MUSIC_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.email-enabled=${MUSIC_EMAIL_ENABLED:false}
app.email-from=${MUSIC_EMAIL_FROM:music@localhost}
spring.mail.host=${MUSIC_SMTP_HOST:localhost}
spring.mail.port=${MUSIC_SMTP_PORT:587}
spring.mail.username=${MUSIC_SMTP_USERNAME:}
spring.mail.password=${MUSIC_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MUSIC_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MUSIC_SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.health.mail.enabled=${MUSIC_EMAIL_ENABLED:false}
