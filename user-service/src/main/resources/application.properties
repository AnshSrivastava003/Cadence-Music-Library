spring.application.name=user-service
server.port=8081
server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
app.jwt-secret=${MUSIC_JWT_SECRET}
app.internal-secret=${MUSIC_INTERNAL_SECRET}
app.user-url=http://localhost:8081
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=jdbc:h2:file:./data/user-service
spring.datasource.username=sa
spring.datasource.password=${MUSIC_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.admin-email=${MUSIC_ADMIN_EMAIL}
app.admin-password=${MUSIC_ADMIN_PASSWORD}
